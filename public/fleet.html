<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tigers Car Rental | Fleet</title>

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


<header class="site-header">

    <div class="nav-inner">


        <a href="index.html" class="logo">

            <div class="logo-mark"></div>

            <div class="logo-text">
                Tigers <span>Car Rental</span>
            </div>

        </a>



        <nav class="nav-links">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a class="active" href="fleet.html">Fleet</a>
            <a href="services.html">Services</a>
            <a href="team.html">Team</a>
            <a href="blog.html">News</a>
            <a href="contact.html">Contact</a>

        </nav>



        <a href="booking.html" class="btn btn-primary">
            Book Now
        </a>


    </div>

</header>




<section class="page-hero">

    <div class="container">

        <h1>
            Our Fleet
        </h1>


        <p>
            Choose from compact, SUV, luxury and sports vehicles.
        </p>


    </div>

</section>




<section class="section">


    <div class="container">



        <div class="fleet-filters">


            <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">
                All
            </button>


            <button class="filter-btn" type="button" data-filter="compact" aria-pressed="false">
                Compact
            </button>


            <button class="filter-btn" type="button" data-filter="suv" aria-pressed="false">
                SUV
            </button>


            <button class="filter-btn" type="button" data-filter="luxury" aria-pressed="false">
                Luxury
            </button>

            <button class="filter-btn" type="button" data-filter="sport" aria-pressed="false">
                Sport
            </button>


        </div>




        <div class="fleet-grid"></div>
        <p class="fleet-empty" data-i18n="fleet.empty" aria-live="polite" hidden></p>


    </div>


</section>



<footer class="site-footer">

    <div class="container">


        <div class="footer-bottom">

            <p>
                © 2026 Tigers Car Rental
            </p>

            <p>
                Skopje, North Macedonia
            </p>


        </div>


    </div>


</footer>



<script src="js/cars.js"></script>
<script src="js/main.js"></script>

</html>
