<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tigers Car Rental | Booking</title>
    <link rel="icon" type="image/svg" href="./images/logoo.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/main.js"></script>

</head>


<body>


<header class="site-header">


    <div class="nav-inner">


        <a href="index.html" class="logo">

            <div class="logo-mark"></div>

            <div class="logo-text">
                Tigers <span>Car Rental</span>
            </div>

        </a>



        <nav class="nav-links">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="fleet.html">Fleet</a>
            <a href="services.html">Services</a>
            <a href="team.html">Team</a>
            <a href="blog.html">News</a>
            <a href="contact.html">Contact</a>

        </nav>


    </div>


</header>





<section class="page-hero">

    <div class="container">

        <h1>
            Book Your Car
        </h1>


        <p>
            Choose your dates and vehicle.
        </p>


    </div>

</section>






<section class="section">


    <div class="container">


        <div class="contact-layout">



            <div>


                <h2 class="section-title">
                    Reservation Form
                </h2>




                <form class="form-grid" id="bookingForm">



                    <div class="form-row">


                        <div class="field">

                            <label>
                                Full Name
                            </label>

                            <input type="text" name="customer_name" required minlength="2" autocomplete="name">

                        </div>



                        <div class="field">

                            <label>
                                Email
                            </label>

                            <input type="email" name="customer_email" required autocomplete="email">

                        </div>



                    </div>





                    <div class="form-row">


                        <div class="field">

                            <label>
                                Phone
                            </label>

                            <input type="tel" name="customer_phone" required minlength="6" autocomplete="tel">

                        </div>



                        <div class="field">

                            <label>
                                Vehicle
                            </label>


                            <select name="car_id" required>

                                <option value="1">
                                    BMW 3 Series
                                </option>

                                <option value="2">
                                    Mercedes-Benz GLC
                                </option>

                                <option value="3">
                                    Audi A4
                                </option>

                                <option value="4">
                                    Volkswagen Golf
                                </option>

                                <option value="5">
                                    Porsche 911 Carrera
                                </option>

                                <option value="6">
                                    Toyota RAV4
                                </option>

                                <option value="7">
                                    MINI Cooper S
                                </option>

                                <option value="8">
                                    Range Rover Evoque
                                </option>

                            </select>


                        </div>



                    </div>





                    <div class="form-row">


                        <div class="field">

                            <label>
                                Pickup Date
                            </label>

                            <input type="date" name="pickup_date" required>

                        </div>



                        <div class="field">

                            <label>
                                Drop-off Date
                            </label>

                            <input type="date" name="dropoff_date" required>

                        </div>


                    </div>





                    <div class="form-row">

                        <div class="field">

                            <label>
                                Pickup Location
                            </label>

                            <select name="pickup_location" required>
                                <option value="Skopje Airport">Skopje Airport</option>
                                <option value="Skopje City Center">Skopje City Center</option>
                            </select>

                        </div>

                        <div class="field">

                            <label>
                                Drop-off Location
                            </label>

                            <select name="dropoff_location" required>
                                <option value="Skopje Airport">Skopje Airport</option>
                                <option value="Skopje City Center">Skopje City Center</option>
                            </select>

                        </div>

                    </div>

                    <div class="field">

                        <label>
                            Notes
                        </label>

                        <textarea name="notes"></textarea>


                    </div>




                    <button class="btn btn-primary" type="submit">

                        Request Booking

                    </button>



                </form>


            </div>






            <div class="contact-info">


                <h3>
                    Rental Information
                </h3>



                <div class="loc-block">

                    <h4>
                        Pickup Locations
                    </h4>

                    <p>
                        Skopje Airport<br>
                        City Center
                    </p>


                </div>




                <div class="loc-block">

                    <h4>
                        Working Hours
                    </h4>

                    <p>
                        24/7 Availability
                    </p>

                </div>



            </div>




        </div>


    </div>


</section>





<footer class="site-footer">


    <div class="container">


        <div class="footer-bottom">

            <p>
                © 2026 Tigers Car Rental
            </p>


        </div>


    </div>


</footer>



</body>

</html>
