<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tigers Car Rental | Contact</title>

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


<header class="site-header">

    <div class="nav-inner">


        <a href="index.html" class="logo">

            <div class="logo-mark"></div>

            <div class="logo-text">
                Tigers <span>Car Rental</span>
            </div>

        </a>


        <nav class="nav-links">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="fleet.html">Fleet</a>
            <a href="services.html">Services</a>
            <a href="team.html">Team</a>
            <a href="blog.html">News</a>
            <a class="active" href="contact.html">Contact</a>

        </nav>


    </div>

</header>





<section class="page-hero">

    <div class="container">

        <h1>
            Contact Us
        </h1>

        <p>
            Have questions? We are here to help.
        </p>

    </div>

</section>





<section class="section">


    <div class="container">


        <div class="contact-layout">



            <div>


                <h2 class="section-title">
                    Send Message
                </h2>



                <form class="form-grid">


                    <div class="form-row">


                        <div class="field">

                            <label>
                                Name
                            </label>

                            <input type="text">

                        </div>



                        <div class="field">

                            <label>
                                Email
                            </label>

                            <input type="email">

                        </div>


                    </div>



                    <div class="field">

                        <label>
                            Subject
                        </label>

                        <input type="text">

                    </div>



                    <div class="field">

                        <label>
                            Message
                        </label>

                        <textarea></textarea>

                    </div>



                    <button class="btn btn-primary">
                        Send Message
                    </button>


                </form>


            </div>





            <div class="contact-info">


                <h3>
                    Visit & Call
                </h3>


                <div class="loc-block">

                    <h4>
                        Address
                    </h4>

                    <p>
                        Skopje, North Macedonia
                    </p>

                </div>



                <div class="loc-block">

                    <h4>
                        Phone
                    </h4>

                    <p>
                        +389 70 000 000
                    </p>

                </div>



                <div class="loc-block">

                    <h4>
                        Email
                    </h4>

                    <p>
                        info@tigersrental.com
                    </p>

                </div>


            </div>



        </div>


    </div>


</section>




<footer class="site-footer">

    <div class="container">

        <div class="footer-bottom">

            <p>
                © 2026 Tigers Car Rental
            </p>

        </div>

    </div>

</footer>



</body>

</html>
